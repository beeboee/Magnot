name: Observe Forge alpha 5 publication

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/publish-observer-trigger

permissions:
  actions: read
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for publication workflow
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const targetSha = '293afead1b199866a015629d12a3f6c8c1ea1ef7';
            const workflowId = 'publish-forge-1.20.1-alpha5.yml';

            for (let attempt = 1; attempt <= 60; attempt++) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                branch: 'main',
                event: 'push',
                per_page: 20
              });

              const run = response.data.workflow_runs.find(candidate => candidate.head_sha === targetSha);
              if (!run) {
                core.info(`Attempt ${attempt}: publication run has not appeared yet.`);
                await new Promise(resolve => setTimeout(resolve, 10000));
                continue;
              }

              core.info(`Publication run ${run.id}: ${run.status} / ${run.conclusion || 'pending'}`);
              if (run.status !== 'completed') {
                await new Promise(resolve => setTimeout(resolve, 10000));
                continue;
              }

              await core.summary
                .addHeading('Forge 1.20.1 alpha 5 publication')
                .addList([
                  `Run: ${run.html_url}`,
                  `Status: ${run.status}`,
                  `Conclusion: ${run.conclusion}`
                ])
                .write();

              if (run.conclusion !== 'success') {
                core.setFailed(`Publication workflow completed with conclusion: ${run.conclusion}`);
              }
              return;
            }

            core.setFailed('Timed out waiting for the Forge alpha 5 publication workflow.');
