name: Publish public port alphas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-port-alphas.yml

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-port-alphas]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: forge-1.20.1
            branch: version/1.20.1-forge
            game_version: 1.20.1
            loader: forge
            loader_name: Forge
            java_build: '17'
            java_listing: '17'
            gradle: '8.8'
            release_name: Magnot 1.2.0 alpha 1 - Forge 1.20.1
            version_id: 1.2.0-alpha.1+mc1.20.1-forge
            file_name: magnot-1.2.0-alpha.1-mc1.20.1-forge.jar
            note: Native visual parity and optional integrations are still being ported.

          - key: neoforge-1.20.1
            branch: version/1.20.1-neoforge
            game_version: 1.20.1
            loader: neoforge
            loader_name: NeoForge
            java_build: '17'
            java_listing: '17'
            gradle: '8.8'
            release_name: Magnot 1.2.0 alpha 1 - NeoForge 1.20.1
            version_id: 1.2.0-alpha.1+mc1.20.1-neoforge
            file_name: magnot-1.2.0-alpha.1-mc1.20.1-neoforge.jar
            note: This uses the final NeoForge 1.20.1 line. Loader-specific runtime reports are requested before stable status.

          - key: fabric-quilt-1.20.1
            branch: version/1.20.1-fabric
            game_version: 1.20.1
            loader: |-
              fabric
              quilt
            loader_name: Fabric / Quilt
            java_build: '17'
            java_listing: '17'
            gradle: '8.12.1'
            release_name: Magnot 1.2.0 alpha 2 - Fabric / Quilt 1.20.1
            version_id: 1.2.0-alpha.2+mc1.20.1-fabric-quilt
            file_name: magnot-1.2.0-alpha.2-mc1.20.1-fabric-quilt.jar
            note: The artifact builds against Fabric and has passed Quilt Loader/QFAPI build validation. Loader-specific runtime reports are still requested.

          - key: forge-1.19.2
            branch: version/1.19.2-forge
            game_version: 1.19.2
            loader: forge
            loader_name: Forge
            java_build: '17'
            java_listing: '17'
            gradle: '7.6.4'
            release_name: Magnot 1.2.0 alpha 1 - Forge 1.19.2
            version_id: 1.2.0-alpha.1+mc1.19.2-forge
            file_name: magnot-1.2.0-alpha.1-mc1.19.2-forge.jar
            note: Native visual parity and optional integrations are still being ported.

          - key: forge-1.18.2
            branch: version/1.18.2-forge
            game_version: 1.18.2
            loader: forge
            loader_name: Forge
            java_build: '17'
            java_listing: '17'
            gradle: '7.6.4'
            release_name: Magnot 1.2.0 alpha 1 - Forge 1.18.2
            version_id: 1.2.0-alpha.1+mc1.18.2-forge
            file_name: magnot-1.2.0-alpha.1-mc1.18.2-forge.jar
            note: This alpha still shares its Java core with the 1.19.2 port while version-specific adapters are separated.

          - key: forge-1.16.5
            branch: version/1.16.5-forge
            game_version: 1.16.5
            loader: forge
            loader_name: Forge
            java_build: '17'
            java_listing: '8'
            gradle: '8.8'
            release_name: Magnot 1.2.0 alpha 1 - Forge 1.16.5
            version_id: 1.2.0-alpha.1+mc1.16.5-forge
            file_name: magnot-1.2.0-alpha.1-mc1.16.5-forge.jar
            note: Native visual parity and legacy integrations are still being ported.

          - key: forge-1.12.2
            branch: version/1.12.2-forge
            game_version: 1.12.2
            loader: forge
            loader_name: Forge
            java_build: '8'
            java_listing: '8'
            gradle: '4.10.3'
            release_name: Magnot 1.2.0 alpha 1 - Forge 1.12.2
            version_id: 1.2.0-alpha.1+mc1.12.2-forge
            file_name: magnot-1.2.0-alpha.1-mc1.12.2-forge.jar
            note: Full visual, synchronization, and legacy integration parity are active work on this paramount target.

          - key: forge-1.7.10
            branch: version/1.7.10-forge
            game_version: 1.7.10
            loader: forge
            loader_name: Forge
            java_build: '8'
            java_listing: '8'
            gradle: '4.4.1'
            release_name: Magnot 1.2.0 alpha 1 - Forge 1.7.10
            version_id: 1.2.0-alpha.1+mc1.7.10-forge
            file_name: magnot-1.2.0-alpha.1-mc1.7.10-forge.jar
            note: This is a dedicated 1.7.10 implementation. Textured client rendering, deterministic client sync, and ecosystem integrations remain active parity work.

    runs-on: ubuntu-latest

    steps:
      - name: Verify CurseForge token
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CURSEFORGE_TOKEN:-}" ]]; then
            echo '::error::Repository secret CURSEFORGE_TOKEN is missing.'
            exit 1
          fi

      - name: Check out ${{ matrix.branch }}
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}

      - name: Set up Java ${{ matrix.java_build }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java_build }}

      - name: Set up Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Build public alpha
        shell: bash
        run: |
          set -euo pipefail
          gradle clean build --stacktrace

          mkdir -p release
          jar="$(find build/libs -maxdepth 1 -type f -name 'magnot-*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-slim.jar' \
            -print | sort | head -n 1)"

          if [[ -z "$jar" || ! -s "$jar" ]]; then
            echo '::error::No release jar was produced.'
            find build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi

          cp "$jar" "release/${{ matrix.file_name }}"

      - name: Resolve CurseForge dependencies
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.key }}' in
            fabric-quilt-1.20.1)
              dependencies=$'fabric-api(required)\ncreate(optional)'
              ;;
            forge-1.12.2|forge-1.7.10)
              dependencies=''
              ;;
            *)
              dependencies='create(optional)'
              ;;
          esac

          {
            echo 'value<<EOF'
            printf '%s\n' "$dependencies"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish public alpha
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1609524
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-dependencies: ${{ steps.deps.outputs.value }}
          files: release/${{ matrix.file_name }}
          name: ${{ matrix.release_name }}
          version: ${{ matrix.version_id }}
          version-type: alpha
          changelog: |
            Public testing build for Minecraft ${{ matrix.game_version }} on ${{ matrix.loader_name }}.

            This is not yet feature-parity-certified with the reference Magnot 1.2 implementation. It is being published so the community can test loader and version combinations early.

            Current alpha baseline:
            - Magnot installs without Create.
            - A usable crafting path is available without optional mods.
            - Persistent ferrous-region storage and a path-blocking core/API are present.
            - Optional rendering and third-party integration parity may still differ by target.

            Known limitation:
            - ${{ matrix.note }}

            Please report the exact Minecraft version, loader version, Magnot filename, whether Create was installed, reproduction steps, and the latest log.
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.game_version }}
          game-version-filter: none
          java: ${{ matrix.java_listing }}
          fail-mode: fail
