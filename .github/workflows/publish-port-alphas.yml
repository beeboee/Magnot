name: Publish public port alphas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-port-alphas.yml

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-port-alphas]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: forge-1.20.1
            branch: version/1.20.1-forge
            game_version: 1.20.1
            loader: forge
            loader_name: Forge
            java_build: '17'
            java_listing: '17'
            gradle: '8.8'
            release_name: Magnot 1.2.0 alpha 2 - Forge 1.20.1
            version_id: 1.2.0-alpha.2+mc1.20.1-forge
            file_name: magnot-1.2.0-alpha.2-mc1.20.1-forge.jar
            note: Magnot-owned parity is implemented and build-validated; in-game runtime reports are requested before stable status.

          - key: neoforge-1.20.1
            branch: version/1.20.1-neoforge
            game_version: 1.20.1
            loader: neoforge
            loader_name: NeoForge
            java_build: '17'
            java_listing: '17'
            gradle: '8.8'
            release_name: Magnot 1.2.0 alpha 2 - NeoForge 1.20.1
            version_id: 1.2.0-alpha.2+mc1.20.1-neoforge
            file_name: magnot-1.2.0-alpha.2-mc1.20.1-neoforge.jar
            note: This uses the final NeoForge 1.20.1 line. Loader-specific runtime reports are requested before stable status.

          - key: fabric-quilt-1.20.1
            branch: version/1.20.1-fabric
            game_version: 1.20.1
            loader: |-
              fabric
              quilt
            loader_name: Fabric / Quilt
            java_build: '17'
            java_listing: '17'
            gradle: '8.12.1'
            release_name: Magnot 1.2.0 alpha 3 - Fabric / Quilt 1.20.1
            version_id: 1.2.0-alpha.3+mc1.20.1-fabric-quilt
            file_name: magnot-1.2.0-alpha.3-mc1.20.1-fabric-quilt.jar
            note: The artifact builds against Fabric and has passed its parity build gate. Fabric- and Quilt-specific runtime reports are still requested.

          - key: forge-1.19.2
            branch: version/1.19.2-forge
            game_version: 1.19.2
            loader: forge
            loader_name: Forge
            java_build: '17'
            java_listing: '17'
            gradle: '7.6.4'
            release_name: Magnot 1.2.0 alpha 2 - Forge 1.19.2
            version_id: 1.2.0-alpha.2+mc1.19.2-forge
            file_name: magnot-1.2.0-alpha.2-mc1.19.2-forge.jar
            note: Magnot-owned parity is implemented and build-validated; in-game runtime reports are requested before stable status.

          - key: forge-1.18.2
            branch: version/1.18.2-forge
            game_version: 1.18.2
            loader: forge
            loader_name: Forge
            java_build: '17'
            java_listing: '17'
            gradle: '7.6.4'
            release_name: Magnot 1.2.0 alpha 2 - Forge 1.18.2
            version_id: 1.2.0-alpha.2+mc1.18.2-forge
            file_name: magnot-1.2.0-alpha.2-mc1.18.2-forge.jar
            note: This target shares its loader-independent core with 1.19.2 and carries version-specific client, resource, and packaging shims.

          - key: forge-1.16.5
            branch: version/1.16.5-forge
            game_version: 1.16.5
            loader: forge
            loader_name: Forge
            java_build: '17'
            java_listing: '8'
            gradle: '8.8'
            release_name: Magnot 1.2.0 alpha 2 - Forge 1.16.5
            version_id: 1.2.0-alpha.2+mc1.16.5-forge
            file_name: magnot-1.2.0-alpha.2-mc1.16.5-forge.jar
            note: The Java 8 implementation has passed its parity build gate; in-game runtime reports are requested before stable status.

          - key: forge-1.12.2
            branch: version/1.12.2-forge
            game_version: 1.12.2
            loader: forge
            loader_name: Forge
            java_build: '8'
            java_listing: '8'
            gradle: '4.10.3'
            release_name: Magnot 1.2.0 alpha 2 - Forge 1.12.2
            version_id: 1.2.0-alpha.2+mc1.12.2-forge
            file_name: magnot-1.2.0-alpha.2-mc1.12.2-forge.jar
            note: The legacy native renderer, synchronization, adaptive Ore Dictionary recipes, and API v2 core have passed the build gate.

          - key: forge-1.7.10
            branch: version/1.7.10-forge
            game_version: 1.7.10
            loader: forge
            loader_name: Forge
            java_build: '8'
            java_listing: '8'
            gradle: '4.4.1'
            release_name: Magnot 1.2.0 alpha 3 - Forge 1.7.10
            version_id: 1.2.0-alpha.3+mc1.7.10-forge
            file_name: magnot-1.2.0-alpha.3-mc1.7.10-forge.jar
            note: The dedicated Java 7 implementation has passed its parity build gate; the vanilla fallback uses one iron ingot and one slime ball per ferrous paste.

    runs-on: ubuntu-latest

    steps:
      - name: Verify CurseForge token
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CURSEFORGE_TOKEN:-}" ]]; then
            echo '::error::Repository secret CURSEFORGE_TOKEN is missing.'
            exit 1
          fi

      - name: Check out ${{ matrix.branch }}
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}

      - name: Set up Java ${{ matrix.java_build }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java_build }}

      - name: Set up Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Build public alpha
        shell: bash
        run: |
          set -euo pipefail
          gradle clean build --stacktrace

          mkdir -p release
          jar="$(find build/libs -maxdepth 1 -type f -name 'magnot-*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-slim.jar' \
            -print | sort | head -n 1)"

          if [[ -z "$jar" || ! -s "$jar" ]]; then
            echo '::error::No release jar was produced.'
            find build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi

          cp "$jar" "release/${{ matrix.file_name }}"

      - name: Resolve CurseForge dependencies
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.key }}' in
            fabric-quilt-1.20.1)
              dependencies=$'fabric-api(required)\ncreate(optional)'
              ;;
            forge-1.12.2|forge-1.7.10)
              dependencies=''
              ;;
            *)
              dependencies='create(optional)'
              ;;
          esac

          {
            echo 'value<<EOF'
            printf '%s\n' "$dependencies"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish public alpha
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1609524
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-dependencies: ${{ steps.deps.outputs.value }}
          files: release/${{ matrix.file_name }}
          name: ${{ matrix.release_name }}
          version: ${{ matrix.version_id }}
          version-type: alpha
          changelog: |
            Public testing build for Minecraft ${{ matrix.game_version }} on ${{ matrix.loader_name }}.

            This alpha implements the Magnot-owned gameplay and presentation capabilities of the reference Magnot 1.2 build. Third-party magnet/vacuum integrations, Sable, moving structures, and Create-backed presentation are tracked separately and are not part of this parity claim.

            Current core baseline:
            - Magnot installs and remains usable without Create.
            - Persistent regions use stable IDs and synchronize to clients.
            - Native Magnot rendering provides nearby outlines, selected highlighting, placement preview, and fade.
            - Region removal is ray-selected and server-validated.
            - Crafting adapts to available iron dust and iron plate materials, with version-appropriate fallback recipes.
            - Region lookup and path blocking use indexed and cached core rules exposed through the public API.

            Validation note:
            - ${{ matrix.note }}

            Please report the exact Minecraft version, loader version, Magnot filename, reproduction steps, and the latest log.
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.game_version }}
          game-version-filter: none
          java: ${{ matrix.java_listing }}
          fail-mode: fail
