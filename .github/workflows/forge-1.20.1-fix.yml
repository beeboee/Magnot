name: Validate Forge 1.20.1 Fix

on:
  push:
    branches:
      - fix/1.20.1-forge-sophisticatedcore-mixin
  pull_request:
    branches:
      - 1.20.1-forge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Forge 1.20.1
        run: gradle clean build --no-daemon --stacktrace

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: magnot-forge-1.20.1-fix
          path: build/libs/*.jar
          if-no-files-found: error
