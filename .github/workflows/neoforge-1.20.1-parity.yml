name: NeoForge 1.20.1 parity

on:
  push:
    branches: [version/1.20.1-neoforge]
  pull_request:
    branches: [1.20.1-neoforge]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neoforge-1201-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build NeoForge 1.20.1 port
        shell: bash
        run: |
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee neoforge-1.20.1-build.log
      - name: Upload port jar, reports, and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-1.20.1-parity
          path: |
            neoforge-1.20.1-build.log
            build/libs/*.jar
            build/reports/**
          if-no-files-found: ignore
          retention-days: 7
