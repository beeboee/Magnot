name: Forge 1.20.1 parity

on:
  push:
    branches: [version/1.20.1-forge]
  pull_request:
    branches: [1.20.1-forge]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-1201-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build Forge 1.20.1 port
        shell: bash
        run: gradle build --stacktrace
      - name: Upload port jar and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.20.1-parity
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: ignore
          retention-days: 7
