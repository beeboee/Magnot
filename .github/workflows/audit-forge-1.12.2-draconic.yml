name: Audit Forge 1.12.2 Draconic magnet

on:
  push:
    branches: [version/1.12.2-forge]
    paths:
      - .github/workflows/audit-forge-1.12.2-draconic.yml
  pull_request:
    branches: [1.12.2-forge-legacy]
    paths:
      - .github/workflows/audit-forge-1.12.2-draconic.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Download and inspect Draconic Evolution
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://cdn.modrinth.com/data/nBqivi8H/versions/jGfLfP4K/Draconic-Evolution-1.12.2-2.3.28.354-universal.jar' -o draconic.jar
          {
            jar tf draconic.jar | grep -Ei 'items/tools/Magnet|Magnet.class' || true
            javap -classpath draconic.jar -c -p com.brandon3055.draconicevolution.items.tools.Magnet || true
          } 2>&1 | tee draconic-audit.log
      - uses: actions/upload-artifact@v4
        with:
          name: forge-1.12.2-draconic-audit
          path: draconic-audit.log
          retention-days: 7
