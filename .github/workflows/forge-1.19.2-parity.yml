name: Forge 1.19.2 parity

on:
  push:
    branches: [version/1.19.2-forge]
  pull_request:
    branches: [1.19.2-forge]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-1192-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build Forge 1.19.2 port
        shell: bash
        run: |
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee forge-1.19.2-build.log
      - name: Upload port jar, reports, and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.19.2-parity
          path: |
            forge-1.19.2-build.log
            build/libs/*.jar
            build/reports/**
          if-no-files-found: ignore
          retention-days: 7
