buildscript {
    repositories {
        mavenCentral()
        maven { name = 'forge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'sonatype'; url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url = 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.github.GTNewHorizons:ForgeGradle:1.2.11'
    }
}

apply plugin: 'forge'
apply plugin: 'maven-publish'

version = '1.2.0-alpha.4+mc1.7.10'
group = 'com.beeboee.magnot'
archivesBaseName = 'magnot-forge'
sourceCompatibility = targetCompatibility = '1.7'

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    runDir = 'run'
}

repositories {
    maven { url = 'https://repo.spongepowered.org/maven' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    compile 'com.github.tox1cozZ:mixin-booter-legacy:1.2.1'
    annotationProcessor 'com.github.tox1cozZ:mixin-booter-legacy:1.2.1:processor'
}

sourceSets.main.java.srcDirs = ['ports/forge-1.7.10/src/main/java']
sourceSets.main.resources.srcDirs = ['ports/forge-1.7.10/src/main/resources']

def mixinRefMapName = 'magnot.refmap.json'
def mixinDir = file("${buildDir}/mixins")
def mixinSrg = file("${mixinDir}/${mixinRefMapName}.srg")
def mixinRefMap = file("${mixinDir}/${mixinRefMapName}")
def reobfSrg = file("${buildDir}/srgs/mcp-srg.srg")

task copySrgs(type: Copy, dependsOn: 'genSrgs') {
    from plugins.getPlugin('forge').delayedFile('{SRG_DIR}')
    include '**/*.srg'
    into file("${buildDir}/srgs")
}

task prepareMixins(dependsOn: copySrgs) {
    doLast {
        mixinDir.mkdirs()
        if (!mixinSrg.exists()) {
            mixinSrg.createNewFile()
        }
    }
}

compileJava.dependsOn prepareMixins
compileJava.options.compilerArgs += [
        '-Xlint:-processing',
        "-AoutSrgFile=${mixinSrg.canonicalPath}",
        "-AoutRefMapFile=${mixinRefMap.canonicalPath}",
        "-AreobfSrgFile=${reobfSrg.canonicalPath}"
]

reobf {
    addExtraSrgFile mixinSrg
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.7.10'

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand version: project.version, mcversion: '1.7.10'
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
    from('src/main/resources/assets/magnot/textures/item') {
        include 'ferrous_paste.png'
        include 'ferrous_tube.png'
        into 'assets/magnot/textures/items'
    }
    from('src/main/resources/assets/magnot/textures/special') {
        include 'ferrous_region.png'
        into 'assets/magnot/textures/special'
    }
}

jar {
    from mixinRefMap
    finalizedBy('reobf')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
}
